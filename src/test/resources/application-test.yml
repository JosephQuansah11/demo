spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true

# Disable frontend auto-launch in tests
app:
  frontend:
    auto-launch: false
    path: "/tmp/test-frontend"
    port: 3000

logging:
  level:
    org.springframework.web: WARN
    home.exercise.java_programming_demo: INFO
    org.hibernate: WARN
